spring:
  datasource:
    url: jdbc:h2:mem:router;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

payments:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    currencies: USD,GBP
  paypal:
    base-url: https://api-m.sandbox.paypal.com
    client-id: ${PAYPAL_CLIENT_ID:paypal_client_placeholder}
    client-secret: ${PAYPAL_CLIENT_SECRET:paypal_secret_placeholder}
    currencies: EUR,AUD
